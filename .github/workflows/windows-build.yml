name: Build QtScrcpy for Windows x64
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4.1.1
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
      - name: Compile and deploy Qt runtime
        shell: cmd
        run: build-windows.cmd "%QT_ROOT_DIR%"
      - uses: actions/upload-artifact@v4
        with:
          name: QtScrcpy-Windows-x64
          path: output/x64/Release/
          if-no-files-found: error
